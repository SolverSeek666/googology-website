<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <title>Googology Calculator</title>
  
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.0.1/math.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/break_eternity.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="calc-title">Googology Calculator</h1>
  <p class="calc-author">by Seek</p>

  <div class="calc-container">
    <div class="output-display" id="calcOutput">
      Output here
    </div>
    
    <div class="input-area">
      <span class="prompt">&gt;</span>
      <input type="text" id="calcInput" placeholder="idk" autofocus>
    </div>

    <div class="keypad">
      <button class="btn constant-btn" onclick="appendInput('e')">e</button>
      <button class="btn constant-btn" onclick="appendInput('π')">&pi;</button>
      <button class="btn constant-btn" onclick="appendInput('ϕ')">&phi;</button>
      <button class="btn constant-btn" onclick="appendInput('∞')">&infin;</button>

      <button class="btn func-btn" onclick="appendInput('√')">&radic;</button>
      <button class="btn func-btn" onclick="appendInput('log')">log</button>
      <button class="btn func-btn" onclick="appendInput('ln')">ln</button>
      <button class="btn func-btn" onclick="appendInput(',')">,</button>

      <button class="btn more-btn" onclick="appendInput('sin')">sin</button>
      <button class="btn more-btn" onclick="appendInput('cos')">cos</button>
      <button class="btn more-btn" onclick="appendInput('tan')">tan</button>
      <button class="btn more-btn" onclick="appendInput('Γ')">Γ</button>
    </div>
  </div>

  <p class="calc-heading">Limit</p>
  <span class="calc-info">10^^2^1024</span>
    
    <p class="calc-heading">Function Index</p>
  <div class="info-container">
    <div class="index-info">
      <div class="func-index">
        <span class="index-info">Basic Operations</span>
        <span class="index-info">a+b</span>
        <span class="index-info">a-b</span>
        <span class="index-info">a*b</span>
        <span class="index-info">a/b</span>
        <span class="index-info">idk</span>

        <span class="index-info">Inverse Functions</span>
        <span class="index-info">√a</span>
        <span class="index-info">√(a,b)</span>
        <span class="index-info">log(a)</span>
        <span class="index-info">log(a,b)</span>
        <span class="index-info">ln(a)</span>

        <span class="index-info">Advanced Functions</span>
        <span class="index-info">a!</span>
        <span class="index-info">Γ(a)</span>
        <span class="index-info">sin(a)</span>
        <span class="index-info">cos(a)</span>
        <span class="index-info">tan(a)</span>

        <span class="index-info">Knuth Arrow Functions</span>
        <span class="index-info">a^b</span>
        <span class="index-info">a^^b</span>
        <span class="index-info">/WIP/</span>
        <span class="index-info">/WIP/</span>
        <span class="index-info">a^^b>c</span>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
