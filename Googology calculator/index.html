<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <title>Googology Calculator</title>
  
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="calc-title">Googology Calculator</h1>
  <p class="calc-author">by Seek</p>

  <div class="calc-container">
    <div class="output-display" id="outputDisplay">
      \[ \text{Output here} \]
    </div>
    
    <div class="input-area">
      <span class="prompt">&gt;</span>
      <input type="text" id="calcInput" placeholder="idk" autofocus>
    </div>
  </div>

  <br>
  <br>
  <p class="calc-heading">Limit</p>
  <span class="calc-info">10^^2^1024</span>
  <p class="calc-heading">Function Index</p>
  <span class="calc-info">Basic Operations: a+b | a-b | a*b | a/b | a!</span>
  <span class="calc-info">Knuth arrows: a^b | a^^b</span>
  <span class="calc-info">Extra: a^^b>c</span>
  <br>
  <br>

  <script src="script.js"></script>
</body>
</html>
