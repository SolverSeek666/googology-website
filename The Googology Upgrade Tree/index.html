<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="format-detection" content="telephone=no">
  <title>The Googology Upgrade Tree</title>
  
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.0.1/math.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/break_eternity.js"></script>
  <script>
    window.MathJax = {
      tex: {
        macros: {
          itra: ["\\color{##ddaaaa}{#1}", 1], // \itra{text}
          itrb: ["\\color{##ffbb99}{#1}", 1], // \itrb{text}
          itrc: ["\\color{##ffffaa}{#1}", 1], // \itrc{text}
          itrd: ["\\color{##bbffaa}{#1}", 1], // \itrd{text}
          itre: ["\\color{##bbccff}{#1}", 1], // \itre{text}
          itrf: ["\\color{##ccbbdd}{#1}", 1], // \itrf{text}
          itrg: ["\\color{##ddaacc}{#1}", 1], // \itrg{text}
          itrh: ["\\color{##ddbbcc}{#1}", 1], // \itrh{text}
          itri: ["\\color{##ddcccc}{#1}", 1] // \itri{text}
        }
      }
    };
  </script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <h1>Numbers: <span id="number-count">0</span></h1>
      <p style="font-size: 0.8rem; color: #888;">(Click this header to manually generate numbers for testing!)</p>
    </header>
    
    <hr class="divider">
    
    <main class="game-body">
      
      <div class="left-panel">
        <button id="upgrade-btn-1" class="upgrade-btn">
          <div class="btn-header">More Digits</div>
          <div class="btn-description">Increase manual click gain by +1</div>
          <div class="btn-cost">Cost: <span id="upgrade-cost-1">10</span></div>
        </button>
      </div>
      
      <div class="right-panel">
        <div class="placeholder-box">
          <p>More stuff i guess</p>
        </div>
      </div>
      
    </main>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
