<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="format-detection" content="telephone=no">
  <title>The Googology Upgrade Tree</title>
  
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.0.1/math.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/break_eternity.js"></script>
  <script>
    window.MathJax = {
      tex: {
        macros: {
          itra: ["\\color{##ddaaaa}{#1}", 1],
          itrb: ["\\color{##ffbb99}{#1}", 1],
          itrc: ["\\color{##ffffaa}{#1}", 1],
          itrd: ["\\color{##bbffaa}{#1}", 1],
          itre: ["\\color{##bbccff}{#1}", 1],
          itrf: ["\\color{##ccbbdd}{#1}", 1],
          itrg: ["\\color{##ddaacc}{#1}", 1],
          itrh: ["\\color{##ddbbcc}{#1}", 1],
          itri: ["\\color{##ddcccc}{#1}", 1]
        }
      }
    };
  </script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <header class="game-header">
      <h1>Numbers: <span id="number-count">0.000</span></h1>
    </header>
    
    <hr class="divider">
    
    <main class="game-body">
      
      <div class="panel">
        <button id="upgrade-btn-1" class="upgrade-btn">
          <div class="btn-header">Upgrade 1</div>
          
          <div class="btn-main-content">
            <div class="btn-left-info">
              <div class="btn-tier">Genesis</div>
              <div class="btn-buy-count">Buy: <span id="upgrade-count-1">0</span>/3</div>
            </div>
            <div class="btn-description">
              Start generating Numbers (base: 0.01/s)
            </div>
          </div>
          
          <div class="btn-cost" id="upgrade-cost-container-1">
            Cost: <span id="upgrade-cost-1">0</span> Numbers
          </div>
        </button>
      </div>
      
      <div class="panel">
        <div class="placeholder-box">
          <p>More stuff i guess (Locked until later)</p>
        </div>
      </div>
      
    </main>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
